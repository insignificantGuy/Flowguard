name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Test (Go ${{ env.GO_VERSION }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test ./... -race -count=1 -v -coverprofile=coverage.out -covermode=atomic

      - name: Build CLI artifacts
        run: |
          mkdir -p bin
          go build -o bin/flowguard ./cmd/server
          go build -o bin/publish-prd ./cmd/publish-prd

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flowguard:${{ github.sha }} .